<!DOCTYPE html>
<html>
<head>
    <title>Finance Tracker - Settings</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="nav-bar">
    <a href="index.html">Dashboard</a>
    <a href="settings.html">Settings</a>
</div>

<h1>Settings</h1>

<div class="dashboard-grid">

    <!-- Categories -->

    <div class="dashboard-card-v2">

        <h2
            class="settings-header"
            onclick="toggleCard('categoriesContent', this)">

            ▶ Categories

        </h2>

        <div
            id="categoriesContent"
            class="settings-content">

            <div id="categoriesList"></div>

        </div>

    </div>

    <!-- Subcategories -->

    <div class="dashboard-card-v2">

        <h2
            class="settings-header"
            onclick="toggleCard('subcategoriesContent', this)">

            ▶ Subcategories

        </h2>

        <div
            id="subcategoriesContent"
            class="settings-content">

            <div id="subcategoriesList"></div>

        </div>

    </div>

    <!-- Accounts -->

    <div class="dashboard-card-v2">

        <h2
            class="settings-header"
            onclick="toggleCard('accountsContent', this)">

            ▶ Accounts

        </h2>

        <div
            id="accountsContent"
            class="settings-content">

            <div id="accountsList"></div>

        </div>

    </div>

    <!-- Credits -->

    <div class="dashboard-card-v2">

        <h2
            class="settings-header"
            onclick="toggleCard('creditsContent', this)">

            ▶ Credits

        </h2>

        <div
            id="creditsContent"
            class="settings-content">

            <div id="creditsList"></div>

        </div>

    </div>

    <!-- Income Sources -->

    <div class="dashboard-card-v2">

        <h2
            class="settings-header"
            onclick="toggleCard('incomeSourcesContent', this)">

            <div id="incomeSourcesList"></div>

        </div>

    </div>

    <!-- Income Types -->

    <div class="dashboard-card-v2">

        <h2
            class="settings-header"
            onclick="toggleCard('incomeTypesContent', this)">

            ▶ Income Types

        </h2>

        <div
            id="incomeTypesContent"
            class="settings-content">

            <div id="incomeTypesList"></div>

        </div>

    </div>

    <!-- Savings Goals -->

    <div class="dashboard-card-v2">

        <h2
            class="settings-header"
            onclick="toggleCard('savingsGoalsContent', this)">

            class="settings-content">

            <div id="recurringExpensesList"></div>

        </div>

    </div>

</div>

<script src="supabase.js"></script>
<script src="settings.js"></script>

</body>
</html>
