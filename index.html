<!DOCTYPE html>
<html>
<head>
    <title>Finance Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="dashboard">

    <div class="card">
        <div class="card-title">Income</div>
        <div class="card-value" id="incomeCard">84,581 MKD</div>
    </div>

    <div class="card">
        <div class="card-title">Spent</div>
        <div class="card-value" id="spentCard">0 MKD</div>
    </div>

    <div class="card">
        <div class="card-title">Remaining</div>
        <div class="card-value" id="remainingCard">0 MKD</div>
    </div>

    <div class="card">
        <div class="card-title">Transactions</div>
        <div class="card-value" id="transactionCard">0</div>
    </div>

</div>
    <hr>
<h2>Budget Progress</h2>

<div class="progress-container">
    <div id="budgetBar"></div>
</div>

<div id="budgetText"></div>


    
<hr>

<h2>Add Income</h2>

<input type="date" id="incomeDate">

<input type="number"
       id="incomeAmount"
       placeholder="Amount">

<select id="incomeSource"></select>

<select id="incomeSubcategory"></select>

<input type="text"
       id="incomeNote"
       placeholder="Note">

<button onclick="saveIncome()">
    Save Income
</button>
<hr>
<h2>Add Expense</h2>

<input type="date" id="date">

<input type="number"
       id="amount"
       placeholder="Amount">

<select id="category"></select>

<select id="subcategory"></select>

<input type="text"
       id="note"
       placeholder="Note">

<button onclick="saveExpense()">
    Save
</button>

<hr>

<h2>This Month</h2>

<div id="summary"></div>
<hr>

<h2>Recent Expenses</h2>

<table id="expensesTable">
    <thead>
        <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Subcategory</th>
            <th>Amount</th>
            <th>Note</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody></tbody>
</table>
<hr>

<h2>Income Breakdown</h2>

<div id="incomeBreakdown"></div>
    
<hr>

<h2>Income History</h2>

<table id="incomeTable">
    <thead>
        <tr>
            <th>Date</th>
            <th>Source</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Note</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody></tbody>
</table>
    
<script src="supabase.js"></script>
<script src="app.js"></script>

</body>
</html>
